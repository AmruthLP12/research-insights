{% extends "registration/base_auth.html" %}
{% block title %}Password Reset Successful{% endblock %}
{% block content %}
    <div class="card bg-base-100 shadow-lg border border-base-300">
        <div class="card-body text-center">
            <h1 class="card-title text-2xl justify-center mb-2">Password Reset Successful</h1>
            <p class="text-base-content/70 mb-4 text-sm">
                Your password has been set. You can now log in with your new password.
            </p>
            <div class="pt-2">
                <a href="{% url 'accounts:login' %}"
                   class="btn btn-primary w-full">Login</a>
            </div>
        </div>
    </div>
{% endblock %}
