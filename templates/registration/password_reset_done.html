{% extends "registration/base_auth.html" %}
{% block title %}Email Sent{% endblock %}
{% block content %}
    <div class="card bg-base-100 shadow-lg border border-base-300">
        <div class="card-body text-center">
            <h1 class="card-title text-2xl justify-center mb-2">Check Your Inbox</h1>
            <p class="text-base-content/70 mb-4 text-sm">
                We’ve emailed you instructions for resetting your password.
                <br><br>
                If the email does not arrive, please check your spam folder.
            </p>
            <div class="pt-2">
                <a href="{% url 'accounts:login' %}"
                   class="btn btn-primary w-full">Back to Login</a>
            </div>
        </div>
    </div>
{% endblock %}
